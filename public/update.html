<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update Escape Atlas</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071722;color:#dff5ef;font:16px/1.7 system-ui}main{max-width:520px;padding:32px}h1{font-size:28px}p{color:#a7c5cd}a{color:#88e8cc}</style></head><body><main><small>ESCAPE ATLAS BY 3SCI LABS</small><h1>Opening the latest atlas…</h1><p id="status" role="status">Refreshing the offline map cache. Your saved mission and results stay on this device.</p><a href="./">Return to the game</a></main><script>
(async()=>{
 const root=new URL('./',location.href),prefix='escape-atlas:'+root.pathname+':';
 try{
  if('serviceWorker'in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.filter(r=>r.scope===root.href).map(r=>r.unregister()));}
  if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith(prefix)).map(k=>caches.delete(k)));}
  location.replace(new URL('./?v=0.8.0',root).href);
 }catch{document.getElementById('status').textContent='The refresh could not finish. Check your connection, then reload this page. Your saved mission has not been changed.';}
})();
</script></body></html>
